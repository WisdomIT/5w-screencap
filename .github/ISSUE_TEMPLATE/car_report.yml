name: 차량 호환성 보고
description: 내 차에서 동작했는지 알려 주세요 (잘 되는 경우도 환영합니다)
title: "[호환성] "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        다른 차종·펌웨어의 결과가 쌓이면 지원 범위를 넓힐 수 있습니다. Launch 화면의 **진단 실행** 결과를 함께 올려 주시면 가장 정확합니다.

  - type: input
    id: car
    attributes:
      label: 차종과 연식
      placeholder: 현대 쏘나타 2021
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: 펌웨어
      placeholder: DN8.KOR.S5W_M.V0xx.001.260902
    validations:
      required: true

  - type: input
    id: hmgapi
    attributes:
      label: HMG-API / NEMESIS 버전
      placeholder: HMG-API 1.1.0, NEMESIS 1.16.7

  - type: input
    id: version
    attributes:
      label: 5W Screencap 버전
      placeholder: 0.1.0

  - type: dropdown
    id: result
    attributes:
      label: 결과
      options:
        - 캡처와 녹화 모두 됨
        - 캡처만 됨
        - 둘 다 안 됨
        - 설치나 화면에 문제가 생김
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 눈에 띈 점
      description: 반응하지 않는 버튼, 검게 찍히는 화면, 녹화 fps 등

  - type: textarea
    id: diag
    attributes:
      label: 진단 결과
      description: "Launch 화면의 **진단 실행**이 끝나면 USB의 `5W-Screencap/diag/<날짜-시간>/SUMMARY.txt`가 생깁니다. 붙여 넣거나 첨부해 주세요."
      render: text
